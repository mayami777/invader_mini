<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>EVE VADER イブベーダー ver.3.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;touch-action:none}
#wrap{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
#hud{height:38px;display:flex;align-items:center;justify-content:space-between;font-weight:800;letter-spacing:1px;font-size:14px}
#gamebox{position:relative;flex:1;min-height:0;border:2px solid #fff;border-radius:10px;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;background:#000}
#controls{height:92px;display:flex;gap:12px;align-items:center;justify-content:center}
.ctrl{width:42%;height:64px;border:2px solid #fff;border-radius:14px;background:#000;color:#fff;font-size:30px;font-weight:900;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;text-align:center;padding:22px;z-index:4}
.panel{width:100%;max-width:420px}
h1{font-size:36px;line-height:1.05;margin:0 0 8px;letter-spacing:2px}
.jp{font-size:20px;margin-bottom:28px}
.small{font-size:13px;line-height:1.7;opacity:.9}
#start,#start2{margin-top:0;border:1px solid #fff;background:#000;color:#fff;border-radius:0;padding:12px 42px;font-size:15px;font-weight:500;letter-spacing:5px}
#message{position:absolute;left:0;right:0;top:43%;text-align:center;font-size:26px;font-weight:900;letter-spacing:2px;pointer-events:none;z-index:3;text-shadow:0 2px #000;display:none}.inverted-message{color:#000!important;text-shadow:none!important}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>STAGE <b id="stage">1</b></span><span>POWER <b id="power">1</b>/6</span><span>LIFE <b id="life">5</b></span></div>
  <div id="gamebox">
    <canvas id="game"></canvas>
    <div id="message"></div>
    <div id="overlay"><div class="panel">
      <h1>EVE VADER</h1>
      <div class="jp"><span style="font-size:13px;letter-spacing:3px">ver.3.2</span></div>
      <button id="start">START</button>
    </div></div>
  </div>
  <div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
</div>
<script>
(()=>{"use strict";
const cvs=document.getElementById("game"),ctx=cvs.getContext("2d");
const overlay=document.getElementById("overlay"),startBtn=document.getElementById("start");
const leftBtn=document.getElementById("left"),rightBtn=document.getElementById("right");
const lifeEl=document.getElementById("life"),stageEl=document.getElementById("stage"),powerEl=document.getElementById("power"),msg=document.getElementById("message");
let W=0,H=0,running=false,last=0,stage=1,life=5,power=1,mode="wave";
let player={x:0,y:0,w:28,h:22},enemies=[],bullets=[],enemyBullets=[],items=[],boss=null;
let dir=1,enemySpeed=28,fireT=0,enemyFireT=0,bossFireT=0,inv=0,moveL=false,moveR=false,endingT=0,transitionT=0;
let audio=null,music=null,mstep=0; let invertT=0; let shakeT=0;
let finalShip=null,finalT=0,finalFireT=0,rushT=0,rushEnemies=[]; let endingFanfareStarted=false;

function resize(){const r=cvs.getBoundingClientRect(),d=devicePixelRatio||1;cvs.width=Math.floor(r.width*d);cvs.height=Math.floor(r.height*d);ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;player.y=H-38;player.x=Math.max(20,Math.min(W-20,player.x||W/2))}
function initAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)()} if(audio.state==="suspended")audio.resume()}
function tone(f,d=.06,v=.035,type="square"){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(n+d)}
function musicStart(){musicStop();mstep=0;music=setInterval(()=>{if(running&&mode!=="ending"){let p=[110,147,123,165,110,147,98,123];tone(p[mstep++%p.length],.07,.012)}},210)}
function musicStop(){if(music){clearInterval(music);music=null}}
function endingMusic(){
 initAudio();
 const melody=[392,523,659,784,659,784,1047,988,784,659,523,659,784,1047];
 melody.forEach((f,i)=>setTimeout(()=>tone(f,.22,.035,(i%3===0)?"triangle":"square"),i*180));
 [196,262,330,392].forEach((f,i)=>setTimeout(()=>tone(f,.55,.018,"sine"),i*360));
} function endingMusic(){
 initAudio();
 const notes=[262,330,392,523,392,440,523,659,523,392,330,262];
 notes.forEach((f,i)=>setTimeout(()=>tone(f,.32,.025,i>7?"sine":"triangle"),i*300));
} 
function message(t,ms=1100){msg.textContent=t;msg.style.display="block";setTimeout(()=>{if(msg.textContent===t)msg.style.display="none"},ms)}
function createWave(){enemies=[];items=[];enemyBullets=[];bullets=[];dir=1;enemySpeed=28+(stage-1)*8;let cols=6+(stage-1)*2, rows=3+(stage-1)*2;
let mini=stage>=4;
let gap=mini?3:(stage===1?10:stage===2?7:4);
let ew=mini?15:Math.min(30,(W-24-(cols-1)*gap)/cols), eh=mini?10:(stage===3?16:20);
let total=cols*ew+(cols-1)*gap,sx=(W-total)/2;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)enemies.push({x:sx+c*(ew+gap),y:45+r*(mini?14:(stage===1?38:stage===2?29:22)),w:ew,h:eh,alive:true,drop:false});enemies[Math.floor(Math.random()*enemies.length)].drop=true;mode="wave";enemyFireT=.8;message("STAGE "+stage)}
function reset(){stage=1;life=5;power=1;finalShip=null;finalT=0;finalFireT=0;rushT=0;rushEnemies=[];endingFanfareStarted=false;stageEl.textContent=stage;lifeEl.textContent=life;powerEl.textContent=power;player.x=W/2;player.y=H-38;createWave()}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function playerBox(){
 let s=stage>=4?.5:1;
 return{x:player.x-player.w*s/2,y:player.y-player.h*s/2,w:player.w*s,h:player.h*s}
}
function coreBox(){
 let s=stage>=4?.5:1;
 let r=5*s;
 return{x:player.x-r,y:player.y-r,w:r*2,h:r*2}
}
function spawnPlayerShots(){
 let mini=stage>=4, bw=mini?2:4, bh=mini?6:12, y0=player.y-(mini?9:18);
 if(power<=3){
   let xs=power===1?[0]:power===2?[-7,7]:[-12,0,12];
   xs.forEach(dx=>bullets.push({x:player.x+dx-(bw/2),y:y0,w:bw,h:bh,vx:0,vy:-420}));
 }else{
   let count=power, spread=power===4?110:power===5?150:190;
   for(let i=0;i<count;i++){
     let t=count===1?.5:i/(count-1);
     let vx=(t-.5)*spread;
     bullets.push({x:player.x-(bw/2),y:y0,w:bw,h:bh,vx,vy:-420});
   }
 }
 tone(720,.035,.018)
}
function dropItem(e){let s=stage>=4?.5:1;items.push({x:e.x+e.w/2-8*s,y:e.y,w:16*s,h:28*s,vy:117})}
function spawnBoss(){mode="boss";bullets=[];enemyBullets=[];let hp=[72,88,105,120,138,160][stage-1];boss={x:W/2,y:110,w:(stage===3||stage===6)?210:180,h:(stage===3||stage===6)?250:190,vx:65+stage*12,hp,max:hp,flash:0};bossFireT=.6;message("STAGE "+stage+" BOSS",1300);tone(110,.3,.07,"sawtooth")}
function bossShots(){
 if(!boss)return;
 const y=boss.y+boss.h*.38, base=(116+stage*8.4)*(stage===3?0.7:1);
 let bt=((stage-1)%3)+1, mini=stage>=4, bw=mini?3:6, bh=mini?6:12;
 if(bt===1){[-28,28].forEach(vx=>enemyBullets.push({x:boss.x-bw/2,y,w:bw,h:bh,vx,vy:base}))}
 if(bt===2){[-110,-75,-40,0,40,75,110].forEach(vx=>enemyBullets.push({x:boss.x-bw/2,y,w:bw,h:bh,vx,vy:base+Math.abs(vx)*.15}))}
 if(bt===3){for(let i=-4;i<=4;i++)enemyBullets.push({x:boss.x-bw/2,y,w:bw,h:bh,vx:i*38,vy:base+Math.abs(i)*8}); let a=Math.atan2(player.y-y,player.x-boss.x);[-.22,0,.22].forEach(s=>enemyBullets.push({x:boss.x-bw/2,y,w:bw,h:bh,vx:Math.cos(a+s)*93.1,vy:Math.sin(a+s)*93.1}))}
 tone(150-stage*15,.045,.025)
}
function bossBox(){return{x:boss.x-boss.w*.38,y:boss.y-boss.h*.42,w:boss.w*.76,h:boss.h*.88}}
function defeatBoss(){invertT=1.15;tone(90,.5,.09,"sawtooth");enemyBullets=[];bullets=[];if(stage===6){message("STAGE 6 CLEAR!",1200);setTimeout(()=>{if(running)startFinalWarning()},1250)}else{mode="transition";transitionT=1.7;message("STAGE "+stage+" CLEAR!",1300)}}

function startFinalWarning(){
  mode="finalWarning";
  finalT=0;
  boss=null;
  enemyBullets=[];
  bullets=[];
  rushEnemies=[];
  musicStop();
  tone(72,.55,.08,"sawtooth");
  msg.classList.remove("inverted-message");
  msg.style.display="block";
  msg.innerHTML="<span style='font-size:34px;letter-spacing:7px'>WARNING</span>";
}
function startFinalIntro(){
  mode="finalIntro";
  finalT=0;
  msg.style.display="none";
  finalShip={
    x:W/2,
    y:-H*.42,
    targetY:H*.16,
    w:W*1.28,
    h:H*.72,
    hp:320,
    max:320,
    flash:0
  };
  tone(52,.8,.08,"sawtooth");
}
function startFinalFight(){
  mode="finalBoss";
  finalFireT=.4;
  rushT=1.4;
  musicStart();
  message("FINAL BATTLE",1400);
}
function finalBossBox(){
  if(!finalShip)return{x:0,y:0,w:0,h:0};
  return{x:0,y:0,w:W,h:Math.min(H*.55,finalShip.y+finalShip.h*.50)};
}
function finalBossShots(){
  if(!finalShip)return;
  const ox=W/2, oy=Math.min(H*.43,finalShip.y+finalShip.h*.48);
  const bw=3,bh=6,base=155;

  // Stage 6以上をイメージした広い弾幕
  for(let i=-5;i<=5;i++){
    enemyBullets.push({
      x:ox-bw/2,y:oy,w:bw,h:bh,
      vx:i*30,vy:base+Math.abs(i)*5
    });
  }

  // 自機狙い5連
  const a=Math.atan2(player.y-oy,player.x-ox);
  [-.30,-.15,0,.15,.30].forEach(s=>{
    enemyBullets.push({
      x:ox-bw/2,y:oy,w:bw,h:bh,
      vx:Math.cos(a+s)*125,
      vy:Math.sin(a+s)*125
    });
  });
  tone(82,.05,.02);
}
function spawnRushLine(){
  rushEnemies=[];
  const ew=14,eh=10,gap=4;
  const cols=Math.ceil(W/(ew+gap))+1;
  const total=cols*(ew+gap)-gap;
  const sx=(W-total)/2;
  for(let c=0;c<cols;c++){
    rushEnemies.push({
      x:sx+c*(ew+gap),
      y:-18,
      w:ew,h:eh,
      vy:118,
      alive:true
    });
  }
  tone(105,.12,.035,"square");
}
function defeatFinalBoss(){
  invertT=1.25;
  mode="ending";
  endingT=0;
  enemyBullets=[];
  bullets=[];
  rushEnemies=[];
  finalShip=null;
  musicStop();
  endingFanfareStarted=false;
  message("FINAL BOSS DESTROYED",1700);
}
function damage(){if(inv>0)return;life--;lifeEl.textContent=life;inv=1.4;shakeT=.55;tone(75,.28,.08,"sawtooth");if(life<=0){running=false;musicStop();overlay.innerHTML='<div class="panel"><h1>GAME OVER</h1><div class="small">タイトルへ戻ります</div></div>';overlay.style.display="flex";setTimeout(showTitle,2500)}}
function showTitle(){running=false;invertT=0;finalShip=null;rushEnemies=[];finalT=0;endingFanfareStarted=false;msg.classList.remove("inverted-message");musicStop();overlay.innerHTML='<div class="panel"><h1>EVE VADER</h1><div class="jp"><span style="font-size:13px;letter-spacing:3px">ver.3.2</span></div><button id="start2">START</button></div>';overlay.style.display="flex";document.getElementById("start2").onclick=startGame}
function update(dt){
 if(!running)return;
 if(invertT>0){invertT=Math.max(0,invertT-dt);msg.classList.add("inverted-message")}else{msg.classList.remove("inverted-message")}
 if(inv>0)inv-=dt; if(shakeT>0)shakeT=Math.max(0,shakeT-dt);

 if(mode==="finalWarning"){
   finalT+=dt;
   // WARNINGを点滅
   msg.style.opacity=(Math.floor(finalT*5)%2===0)?"1":"0.25";
   if(finalT>=2.3){
     msg.style.opacity="1";
     startFinalIntro();
   }
   return;
 }

 if(mode==="finalIntro"){
   finalT+=dt;
   if(finalShip){
     finalShip.y+=(finalShip.targetY-finalShip.y)*Math.min(1,dt*.75);
     if(finalT>=4.3){
       finalShip.y=finalShip.targetY;
       startFinalFight();
     }
   }
   return;
 }

 if(mode==="ending"){
   invertT=0;
   msg.classList.remove("inverted-message");
   msg.style.display="none";
   endingT+=dt;
   if(!endingFanfareStarted){endingFanfareStarted=true;endingMusic()}
   if(endingT>8.5){showTitle()}
   return
 }
 if(mode==="transition"){transitionT-=dt;if(transitionT<=0){stage++;stageEl.textContent=stage;createWave()}return}
 let sp=210+(stage-1)*8;if(moveL)player.x-=sp*dt;if(moveR)player.x+=sp*dt;player.x=Math.max(18,Math.min(W-18,player.x));
 fireT-=dt;if(fireT<=0){spawnPlayerShots();fireT=.31}
 bullets.forEach(b=>{b.y+=b.vy*dt;if(b.vx)b.x+=b.vx*dt});bullets=bullets.filter(b=>b.y>-30);
 enemyBullets.forEach(b=>{b.x+=(b.vx||0)*dt;b.y+=b.vy*dt});enemyBullets=enemyBullets.filter(b=>b.y<H+30&&b.x>-40&&b.x<W+40);
 items.forEach(i=>i.y+=i.vy*dt);items=items.filter(i=>i.y<H+40);
 if(mode==="wave"){
  let min=9999,max=-9999,bottom=0;enemies.forEach(e=>{if(e.alive){min=Math.min(min,e.x);max=Math.max(max,e.x+e.w);bottom=Math.max(bottom,e.y+e.h)}});
  let down=false;if(min<9999&&((dir>0&&max>W-10)||(dir<0&&min<10))){dir*=-1;down=true}
  enemies.forEach(e=>{if(e.alive){e.x+=dir*enemySpeed*dt;if(down)e.y+=12}});
  enemyFireT-=dt;if(enemyFireT<=0){let a=enemies.filter(e=>e.alive);if(a.length){let e=a[Math.floor(Math.random()*a.length)];let ms=stage>=4?.5:1;enemyBullets.push({x:e.x+e.w/2-2*ms,y:e.y+e.h,w:4*ms,h:10*ms,vx:0,vy:(stage===3?(180+stage*15)*0.7:(180+stage*15))})}enemyFireT=Math.max(.45,1.05-stage*.08)}
  bullets.forEach(b=>enemies.forEach(e=>{if(e.alive&&hit(b,e)){e.alive=false;b.y=-99;tone(190,.06,.025);if(e.drop)dropItem(e)}}));
  if(bottom>player.y-18)damage();
  if(enemies.length&&enemies.every(e=>!e.alive))spawnBoss();
 }else if(mode==="boss"&&boss){
  boss.x+=boss.vx*dt;let half=boss.w*.38;if(boss.x+half>W-8){boss.x=W-8-half;boss.vx=-Math.abs(boss.vx)}if(boss.x-half<8){boss.x=8+half;boss.vx=Math.abs(boss.vx)}
  bossFireT-=dt;if(bossFireT<=0){bossShots();bossFireT=stage===1?.78:stage===2?1.03:stage===3?.80:stage===4?.70:stage===5?.82:.64}
  let bb=bossBox();bullets.forEach(b=>{if(hit(b,bb)){b.y=-99;boss.hp--;boss.flash=.08;if(boss.hp%4===0)tone(180,.04,.018);if(boss.hp<=0)defeatBoss()}});
  if(boss.flash>0)boss.flash-=dt;

 }else if(mode==="finalBoss"&&finalShip){
  finalFireT-=dt;
  if(finalFireT<=0){finalBossShots();finalFireT=.62}

  rushT-=dt;
  if(rushT<=0){
    if(!rushEnemies.some(e=>e.alive))spawnRushLine();
    rushT=3.25;
  }

  rushEnemies.forEach(e=>{
    if(e.alive)e.y+=e.vy*dt;
    if(e.y>H+20)e.alive=false;
  });

  // 自機弾で突撃ザコを倒せる
  bullets.forEach(b=>{
    rushEnemies.forEach(e=>{
      if(e.alive&&hit(b,e)){
        e.alive=false;
        b.y=-99;
        tone(205,.04,.018);
      }
    });
  });

  // 残った弾が巨大戦艦に当たる
  const fb=finalBossBox();
  bullets.forEach(b=>{
    if(b.y>-90&&hit(b,fb)){
      b.y=-99;
      finalShip.hp--;
      finalShip.flash=.07;
      if(finalShip.hp%8===0)tone(135,.045,.018);
      if(finalShip.hp<=0)defeatFinalBoss();
    }
  });

  if(finalShip&&finalShip.flash>0)finalShip.flash-=dt;
 }
 const pb=playerBox(), cb=coreBox();
 enemyBullets.forEach(b=>{if(b.y<900&&hit(b,cb)){b.y=999;damage()}});
 rushEnemies.forEach(e=>{if(e.alive&&hit(e,cb)){e.alive=false;damage()}});
 items.forEach(i=>{if(hit(i,pb)){i.y=999;if(power<6){power++;powerEl.textContent=power;tone(330,.08,.05);setTimeout(()=>tone(550,.1,.05),80)}else tone(700,.08,.03)}});
 items=items.filter(i=>i.y<900);
}
function drawEnemy(e){
 let s=e.w/30;
 ctx.save();ctx.translate(e.x,e.y);ctx.scale(s,s);
 ctx.fillStyle="#fff";ctx.fillRect(5,0,20,5);ctx.fillRect(0,5,30,12);
 ctx.fillStyle="#000";ctx.fillRect(7,8,4,4);ctx.fillRect(19,8,4,4);
 ctx.fillStyle="#fff";ctx.fillRect(3,17,6,5);ctx.fillRect(21,17,6,5);
 ctx.restore()
}
function drawCapsule(i){ctx.save();ctx.translate(i.x+i.w/2,i.y+i.h/2);ctx.rotate(.25);let s=i.w/16;ctx.scale(s,s);ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-7,-13,14,26,7);ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.roundRect(-6,0,12,12,5);ctx.fill();ctx.restore()}
function drawBoss(){
 if(!boss)return;let bossType=((stage-1)%3)+1;ctx.save();ctx.translate(boss.x,boss.y);if(boss.flash>0)ctx.globalAlpha=.45;ctx.fillStyle="#fff";ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.lineJoin="round";
 if(bossType===1){
  ctx.beginPath();ctx.ellipse(0,-40,55,43,0,0,Math.PI*2);ctx.fill();ctx.fillRect(-39,2,78,83);
  ctx.beginPath();ctx.moveTo(-39,20);ctx.lineTo(-82,8);ctx.lineTo(-68,22);ctx.lineTo(-88,32);ctx.lineTo(-65,42);ctx.lineTo(-39,38);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(39,20);ctx.lineTo(82,8);ctx.lineTo(68,22);ctx.lineTo(88,32);ctx.lineTo(65,42);ctx.lineTo(39,38);ctx.closePath();ctx.fill();
  ctx.fillRect(-28,82,18,55);ctx.fillRect(10,82,18,55);
  ctx.fillStyle="#000";[[-22,-48],[22,-48],[0,-22]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill()});
 } else if(bossType===2){
  // 2面ボス: 四角い顔、4本の手、3本の足
  ctx.fillStyle="#fff";
  ctx.fillRect(-58,-92,116,92);

  ctx.fillStyle="#000";
  ctx.beginPath();ctx.moveTo(-38,-66);ctx.lineTo(-12,-74);ctx.lineTo(-21,-51);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(38,-66);ctx.lineTo(12,-74);ctx.lineTo(21,-51);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-27,-36);ctx.lineTo(0,-9);ctx.lineTo(27,-36);ctx.lineTo(19,-3);ctx.lineTo(0,10);ctx.lineTo(-19,-3);ctx.closePath();ctx.fill();

  ctx.fillStyle="#fff";
  ctx.fillRect(-48,4,96,94);

  // 4本の手
  ctx.beginPath();ctx.moveTo(-48,22);ctx.lineTo(-106,4);ctx.lineTo(-85,26);ctx.lineTo(-112,38);ctx.lineTo(-48,43);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(48,22);ctx.lineTo(106,4);ctx.lineTo(85,26);ctx.lineTo(112,38);ctx.lineTo(48,43);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-48,58);ctx.lineTo(-110,55);ctx.lineTo(-92,76);ctx.lineTo(-48,78);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(48,58);ctx.lineTo(110,55);ctx.lineTo(92,76);ctx.lineTo(48,78);ctx.closePath();ctx.fill();

  // 3本の足
  ctx.fillRect(-35,96,18,60);
  ctx.fillRect(-9,96,18,66);
  ctx.fillRect(17,96,18,60);
 } else {
  // 3面ボス: 3本の首と顔、体中にある複数の顔
  ctx.fillStyle="#fff";
  ctx.fillRect(-52,-18,104,185);

  // 3本の首
  ctx.strokeStyle="#fff";
  ctx.lineWidth=12;
  ctx.beginPath();
  ctx.moveTo(-30,-18);ctx.lineTo(-58,-96);
  ctx.moveTo(0,-18);ctx.lineTo(0,-110);
  ctx.moveTo(30,-18);ctx.lineTo(58,-96);
  ctx.stroke();

  function faceBox(x,y,w,h,evil=false){
    ctx.fillStyle="#fff";ctx.fillRect(x-w/2,y-h/2,w,h);
    ctx.fillStyle="#000";
    if(evil){
      ctx.beginPath();ctx.moveTo(x-w*.26,y-h*.13);ctx.lineTo(x-w*.05,y-h*.25);ctx.lineTo(x-w*.13,y-h*.02);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(x+w*.26,y-h*.13);ctx.lineTo(x+w*.05,y-h*.25);ctx.lineTo(x+w*.13,y-h*.02);ctx.closePath();ctx.fill();
    }else{
      ctx.beginPath();ctx.arc(x-w*.18,y-h*.12,5,0,Math.PI*2);ctx.arc(x+w*.18,y-h*.12,5,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle="#000";ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(x,y+h*.18,w*.21,h*.10,0,0,Math.PI*2);ctx.stroke();
  }
  faceBox(-62,-121,58,54,false);
  faceBox(0,-137,60,58,true);
  faceBox(62,-121,58,54,false);

  // 左右の腕
  ctx.strokeStyle="#fff";ctx.lineWidth=10;
  ctx.beginPath();
  ctx.moveTo(-52,20);ctx.lineTo(-118,-10);
  ctx.moveTo(-52,75);ctx.lineTo(-122,66);
  ctx.moveTo(52,20);ctx.lineTo(118,-10);
  ctx.moveTo(52,75);ctx.lineTo(122,66);
  ctx.stroke();

  // 体中の顔
  function smallFace(x,y,r,type){
    ctx.strokeStyle="#000";ctx.fillStyle="#000";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
    if(type===0){
      ctx.beginPath();ctx.arc(x-r*.35,y-r*.2,2,0,Math.PI*2);ctx.arc(x+r*.35,y-r*.2,2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(x,y+r*.25,r*.35,0,Math.PI);ctx.stroke();
    }else if(type===1){
      ctx.beginPath();ctx.moveTo(x-r*.5,y-r*.2);ctx.lineTo(x-r*.1,y-r*.35);ctx.moveTo(x+r*.5,y-r*.2);ctx.lineTo(x+r*.1,y-r*.35);ctx.stroke();
      ctx.beginPath();ctx.ellipse(x,y+r*.25,r*.38,r*.22,0,0,Math.PI*2);ctx.stroke();
    }else{
      ctx.beginPath();ctx.arc(x-r*.35,y-r*.18,2.5,0,Math.PI*2);ctx.arc(x+r*.35,y-r*.18,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.moveTo(x-r*.35,y+r*.35);ctx.lineTo(x-r*.15,y+r*.08);ctx.lineTo(x,y+r*.35);ctx.lineTo(x+r*.15,y+r*.08);ctx.lineTo(x+r*.35,y+r*.35);ctx.stroke();
    }
  }
  smallFace(-26,8,13,0);
  smallFace(25,7,13,1);
  smallFace(0,43,15,2);
  smallFace(-27,78,13,1);
  smallFace(28,78,13,0);
  smallFace(-20,120,12,2);
  smallFace(21,121,12,1);

  ctx.strokeStyle="#000";ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,150,22,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="#000";
  ctx.beginPath();ctx.arc(-8,145,3,0,Math.PI*2);ctx.arc(8,145,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,157,10,5,0,0,Math.PI*2);ctx.stroke();

  // 3本足
  ctx.fillStyle="#fff";
  ctx.fillRect(-38,166,18,55);
  ctx.fillRect(-9,166,18,62);
  ctx.fillRect(20,166,18,55);
 }
 ctx.restore();
 const bw=Math.min(W-50,300),ratio=Math.max(0,boss.hp/boss.max);ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.strokeRect((W-bw)/2,10,bw,10);ctx.fillStyle="#fff";ctx.fillRect((W-bw)/2+2,12,(bw-4)*ratio,6);
}

function drawFinalShip(){
 if(!finalShip)return;
 ctx.save();
 if(finalShip.flash>0)ctx.globalAlpha=.5;

 const x=finalShip.x,y=finalShip.y,w=finalShip.w,h=finalShip.h;
 ctx.fillStyle="#fff";
 ctx.strokeStyle="#000";
 ctx.lineWidth=2;

 // 巨大な逆三角形戦艦。上側は画面外へ広がり、先端が下を向く。
 ctx.beginPath();
 ctx.moveTo(x-w/2,y-h/2);
 ctx.lineTo(x+w/2,y-h/2);
 ctx.lineTo(x,y+h/2);
 ctx.closePath();
 ctx.fill();

 // モノクロの船体ディテール
 ctx.strokeStyle="#000";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(x-w*.34,y-h*.33);ctx.lineTo(x,y+h*.34);
 ctx.moveTo(x+w*.34,y-h*.33);ctx.lineTo(x,y+h*.34);
 ctx.moveTo(x-w*.22,y-h*.20);ctx.lineTo(x+w*.22,y-h*.20);
 ctx.moveTo(x-w*.15,y-h*.05);ctx.lineTo(x+w*.15,y-h*.05);
 ctx.moveTo(x-w*.08,y+h*.10);ctx.lineTo(x+w*.08,y+h*.10);
 ctx.stroke();

 // 黒い砲門
 ctx.fillStyle="#000";
 for(let i=-4;i<=4;i++){
   const py=y-h*.23+Math.abs(i)*6;
   ctx.beginPath();
   ctx.arc(x+i*22,py,4,0,Math.PI*2);
   ctx.fill();
 }

 ctx.restore();

 if(mode==="finalBoss"){
   const bw=Math.min(W-42,330);
   const ratio=Math.max(0,finalShip.hp/finalShip.max);
   ctx.strokeStyle="#fff";ctx.lineWidth=2;
   ctx.strokeRect((W-bw)/2,10,bw,10);
   ctx.fillStyle="#fff";
   ctx.fillRect((W-bw)/2+2,12,(bw-4)*ratio,6);
   ctx.font="bold 11px -apple-system,sans-serif";
   ctx.textAlign="center";
   ctx.fillText("FINAL BOSS",W/2,34);
 }
}

function drawPrincessEnding(){
 const cx=W/2, cy=Math.max(135,H*.34), s=Math.min(W/360,H/620);
 ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
 ctx.strokeStyle="#fff";ctx.fillStyle="#fff";ctx.lineWidth=4;ctx.lineCap="square";ctx.lineJoin="miter";

 function scribble(points,offs){
   offs.forEach(off=>{ctx.beginPath();points.forEach((p,i)=>{let x=p[0]+off,y=p[1]+(i%2?off*.25:-off*.15);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});
 }
 scribble([[-112,-62],[-132,-38],[-142,-5],[-147,35],[-143,78],[-132,118],[-118,145],[-110,110],[-104,72],[-96,34],[-86,-3],[-74,-31],[-58,-49]],[-7,-2,3,7]);
 scribble([[112,-55],[130,-42],[144,-15],[155,20],[164,53],[168,83],[161,106],[146,86],[132,61],[120,31],[106,-5],[91,-33],[74,-49]],[-7,-2,3,7]);

 ctx.beginPath();ctx.moveTo(-82,-58);ctx.quadraticCurveTo(-106,-32,-104,30);ctx.quadraticCurveTo(-101,92,-64,116);ctx.quadraticCurveTo(0,143,66,116);ctx.quadraticCurveTo(104,88,104,28);ctx.quadraticCurveTo(105,-29,78,-55);ctx.stroke();

 ctx.beginPath();ctx.moveTo(-80,-68);ctx.lineTo(-72,-132);ctx.lineTo(-38,-87);ctx.lineTo(-24,-142);ctx.lineTo(2,-86);ctx.lineTo(30,-146);ctx.lineTo(40,-86);ctx.lineTo(70,-150);ctx.lineTo(82,-67);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-82,-67);ctx.quadraticCurveTo(0,-57,82,-67);ctx.stroke();
 [-55,-18,18,57].forEach(x=>{ctx.beginPath();ctx.arc(x,-72,10,0,Math.PI*2);ctx.stroke()});

 ctx.beginPath();ctx.arc(-42,-18,23,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(43,-18,23,0,Math.PI*2);ctx.stroke();
 ctx.fillRect(-38,-25,7,13);ctx.fillRect(39,-25,7,13);
 ctx.beginPath();ctx.arc(-47,46,28,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(50,45,30,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-18,21);ctx.quadraticCurveTo(0,34,18,22);ctx.lineTo(16,51);ctx.quadraticCurveTo(0,68,-15,49);ctx.closePath();ctx.stroke();
 ctx.restore();

 ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font='bold 30px "Courier New", monospace';ctx.fillText("Thanks!!!",W/2,Math.min(H-95,cy+190*s));

 ctx.save();ctx.translate(player.x,player.y);if(stage>=4)ctx.scale(.5,.5);ctx.fillStyle="#fff";
 ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(16,12);ctx.lineTo(6,8);ctx.lineTo(0,13);ctx.lineTo(-6,8);ctx.lineTo(-16,12);ctx.closePath();ctx.fill();
 ctx.fillStyle="#000";ctx.fillRect(-3,1,6,7);ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(mode==="ending"){
   ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";
   for(let i=0;i<42;i++){let x=(i*73+17)%Math.max(1,W),y=(i*131+29)%Math.max(1,H-60);ctx.fillRect(x,y,(i%7===0?2:1),(i%7===0?2:1))}
   drawPrincessEnding();return;
 }
 ctx.save();if(shakeT>0){ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*6)}ctx.fillStyle="#fff";
 for(let i=0;i<30;i++){let x=(i*83+stage*19)%Math.max(1,W),y=(i*137)%Math.max(1,H-80);ctx.fillRect(x,y,1,1)}
 if(mode==="wave")enemies.forEach(e=>{if(e.alive)drawEnemy(e)});
 if(mode==="boss")drawBoss();
 if(mode==="finalIntro"||mode==="finalBoss")drawFinalShip();
 if(mode==="finalBoss")rushEnemies.forEach(e=>{if(e.alive)drawEnemy(e)});
 items.forEach(drawCapsule);ctx.fillStyle="#fff";bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
 if(mode!=="finalWarning"&&(inv<=0||Math.floor(inv*12)%2===0)){ctx.save();ctx.translate(player.x,player.y);if(stage>=4)ctx.scale(.5,.5);ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(16,12);ctx.lineTo(6,8);ctx.lineTo(0,13);ctx.lineTo(-6,8);ctx.lineTo(-16,12);ctx.closePath();ctx.fill();ctx.fillStyle="#000";ctx.fillRect(-3,1,6,7);ctx.restore()}
 if(invertT>0){
   ctx.save();
   ctx.globalCompositeOperation="difference";
   ctx.fillStyle="#fff";
   ctx.fillRect(0,0,W,H);
   ctx.restore();
 }
 ctx.restore();
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function startGame(){initAudio();resize();reset();overlay.style.display="none";running=true;musicStart();last=performance.now()}
function bind(btn,key){const on=e=>{e.preventDefault();initAudio();if(key==="L")moveL=true;else moveR=true},off=e=>{e.preventDefault();if(key==="L")moveL=false;else moveR=false};["pointerdown","touchstart"].forEach(n=>btn.addEventListener(n,on,{passive:false}));["pointerup","pointercancel","pointerleave","touchend","touchcancel"].forEach(n=>btn.addEventListener(n,off,{passive:false}))}
bind(leftBtn,"L");bind(rightBtn,"R");startBtn.onclick=startGame;
["contextmenu","selectstart","dragstart"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
window.addEventListener("resize",resize);resize();requestAnimationFrame(loop);
})();
</script>
