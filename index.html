<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>INVADER MINI</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #hud {
    height: 52px;
    flex: 0 0 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-bottom: 1px solid #333;
    font-weight: 700;
    letter-spacing: .04em;
  }
  #game {
    display: block;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    background: #000;
  }
  #controls {
    height: 112px;
    flex: 0 0 112px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid #333;
    background: #050505;
  }
  button {
    border: 2px solid #fff;
    background: #111;
    color: #fff;
    border-radius: 14px;
    font-size: 34px;
    font-weight: 800;
    touch-action: none;
  }
  button:active, button.on { background: #fff; color: #000; }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.78);
    z-index: 5;
    padding: 24px;
  }
  #panel {
    width: min(420px, 92vw);
    text-align: center;
    border: 2px solid #fff;
    border-radius: 16px;
    padding: 24px 18px;
    background: #050505;
  }
  #panel h1 { margin: 0 0 10px; font-size: 30px; }
  #panel p { margin: 8px 0 18px; line-height: 1.6; color: #ddd; }
  #startBtn {
    width: 100%;
    min-height: 58px;
    font-size: 22px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>LIFE <span id="life">3</span></div>
  </div>

  <canvas id="game"></canvas>

  <div id="controls">
    <button id="leftBtn" aria-label="左へ">◀</button>
    <button id="rightBtn" aria-label="右へ">▶</button>
  </div>
</div>

<div id="overlay">
  <div id="panel">
    <h1>INVADER MINI</h1>
    <p>左右ボタンで移動します。<br>弾は自動で発射されます。</p>
    <button id="startBtn">ゲーム開始</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const lifeEl = document.getElementById('life');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const startBtn = document.getElementById('startBtn');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  let W = 0, H = 0, dpr = 1;
  let running = false;
  let last = 0;
  let score = 0;
  let life = 3;
  let moveLeft = false;
  let moveRight = false;
  let fireTimer = 0;
  let enemyShotTimer = 0;
  let enemyDir = 1;
  let enemySpeed = 28;

  const player = { x: 0, y: 0, w: 34, h: 18, speed: 220, inv: 0 };
  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let stars = [];

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    player.y = H - 38;
    player.x = Math.min(Math.max(player.x || W / 2, player.w / 2), W - player.w / 2);

    if (!stars.length) {
      stars = Array.from({length: 70}, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() < .85 ? 1 : 2
      }));
    }
  }

  function resetGame() {
    score = 0;
    life = 3;
    scoreEl.textContent = score;
    lifeEl.textContent = life;
    bullets = [];
    enemyBullets = [];
    player.x = W / 2;
    player.inv = 0;
    enemyDir = 1;
    enemySpeed = 28;
    createWave();
  }

  function createWave() {
    enemies = [];
    const cols = W < 390 ? 7 : 8;
    const rows = 4;
    const ew = 24, eh = 16;
    const gapX = 15, gapY = 18;
    const total = cols * ew + (cols - 1) * gapX;
    const startX = (W - total) / 2;
    const startY = 58;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        enemies.push({
          x: startX + c * (ew + gapX),
          y: startY + r * (eh + gapY),
          w: ew, h: eh,
          alive: true,
          row: r
        });
      }
    }
  }

  function rectHit(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
  }

  function update(dt) {
    if (!running) return;

    const dir = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);
    player.x += dir * player.speed * dt;
    player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
    if (player.inv > 0) player.inv -= dt;

    fireTimer -= dt;
    if (fireTimer <= 0) {
      bullets.push({ x: player.x - 2, y: player.y - 10, w: 4, h: 12, vy: -390 });
      fireTimer = 0.32;
    }

    bullets.forEach(b => b.y += b.vy * dt);
    bullets = bullets.filter(b => b.y + b.h > 0);

    enemyBullets.forEach(b => b.y += b.vy * dt);
    enemyBullets = enemyBullets.filter(b => b.y < H + 20);

    let minX = Infinity, maxX = -Infinity, bottomY = 0;
    for (const e of enemies) if (e.alive) {
      minX = Math.min(minX, e.x);
      maxX = Math.max(maxX, e.x + e.w);
      bottomY = Math.max(bottomY, e.y + e.h);
    }

    let stepDown = false;
    if (minX !== Infinity) {
      if ((enemyDir > 0 && maxX >= W - 12) || (enemyDir < 0 && minX <= 12)) {
        enemyDir *= -1;
        stepDown = true;
      }
      for (const e of enemies) if (e.alive) {
        e.x += enemyDir * enemySpeed * dt;
        if (stepDown) e.y += 12;
      }
    }

    enemyShotTimer -= dt;
    if (enemyShotTimer <= 0) {
      const alive = enemies.filter(e => e.alive);
      if (alive.length) {
        const shooter = alive[Math.floor(Math.random() * alive.length)];
        enemyBullets.push({
          x: shooter.x + shooter.w/2 - 2,
          y: shooter.y + shooter.h + 3,
          w: 4, h: 10, vy: 180 + Math.min(score, 800) * 0.04
        });
      }
      enemyShotTimer = Math.max(.45, 1.15 - score / 1600);
    }

    for (const b of bullets) {
      for (const e of enemies) {
        if (!e.alive) continue;
        if (rectHit(b, e)) {
          e.alive = false;
          b.y = -999;
          score += 10;
          scoreEl.textContent = score;
          enemySpeed = Math.min(72, enemySpeed + .45);
          break;
        }
      }
    }
    bullets = bullets.filter(b => b.y > -100);

    const pRect = { x: player.x - player.w/2, y: player.y - player.h/2, w: player.w, h: player.h };
    if (player.inv <= 0) {
      for (const b of enemyBullets) {
        if (rectHit(b, pRect)) {
          b.y = H + 999;
          life--;
          lifeEl.textContent = life;
          player.inv = 1.2;
          if (life <= 0) endGame();
          break;
        }
      }
    }

    if (bottomY >= player.y - 18) endGame();

    if (enemies.every(e => !e.alive)) {
      score += 100;
      scoreEl.textContent = score;
      enemySpeed = Math.min(80, enemySpeed + 6);
      createWave();
      bullets = [];
      enemyBullets = [];
    }
  }

  function drawPlayer() {
    const x = Math.round(player.x - player.w/2);
    const y = Math.round(player.y - player.h/2);
    if (player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) return;

    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 14, y, 6, 5);
    ctx.fillRect(x + 8, y + 5, 18, 5);
    ctx.fillRect(x, y + 10, 34, 8);
  }

  function drawEnemy(e) {
    const x = Math.round(e.x), y = Math.round(e.y);
    ctx.fillStyle = '#fff';
    const s = 3;
    ctx.fillRect(x + 3*s, y, 2*s, s);
    ctx.fillRect(x + 1*s, y + 1*s, 6*s, s);
    ctx.fillRect(x, y + 2*s, 8*s, 2*s);
    ctx.fillRect(x + 1*s, y + 4*s, 2*s, s);
    ctx.fillRect(x + 5*s, y + 4*s, 2*s, s);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#444';
    for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s);

    for (const e of enemies) if (e.alive) drawEnemy(e);

    ctx.fillStyle = '#fff';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    ctx.fillStyle = '#aaa';
    enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    drawPlayer();

    ctx.strokeStyle = '#444';
    ctx.beginPath();
    ctx.moveTo(0, H - 18);
    ctx.lineTo(W, H - 18);
    ctx.stroke();
  }

  function loop(t) {
    const dt = Math.min((t - last) / 1000 || 0, .034);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    resize();
    resetGame();
    overlay.style.display = 'none';
    running = true;
    last = performance.now();
  }

  function endGame() {
    running = false;
    panel.innerHTML = `
      <h1>GAME OVER</h1>
      <p>SCORE ${score}</p>
      <button id="restartBtn">もう一度</button>
    `;
    overlay.style.display = 'flex';
    document.getElementById('restartBtn').addEventListener('click', startGame, {once:true});
  }

  function bindHold(btn, side) {
    const set = v => {
      if (side === 'left') moveLeft = v;
      else moveRight = v;
      btn.classList.toggle('on', v);
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      btn.setPointerCapture?.(e.pointerId);
      set(true);
    });
    ['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev => {
      btn.addEventListener(ev, () => set(false));
    });
  }

  bindHold(leftBtn, 'left');
  bindHold(rightBtn, 'right');

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      moveLeft = false;
      moveRight = false;
    }
  });

  startBtn.addEventListener('click', startGame);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
