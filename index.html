<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>INVADER MINI</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    touch-action: none;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #hud {
    height: 52px;
    flex: 0 0 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    border-bottom: 1px solid #333;
    font-weight: 700;
    letter-spacing: .04em;
  }
  #game {
    display: block;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    background: #000;
  }
  #controls {
    height: 112px;
    flex: 0 0 112px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid #333;
    background: #050505;
  }
  button {
    border: 2px solid #fff;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    background: #111;
    color: #fff;
    border-radius: 14px;
    font-size: 34px;
    font-weight: 800;
    touch-action: none;
  }
  button:active, button.on { background: #fff; color: #000; }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.78);
    z-index: 5;
    padding: 24px;
  }
  #panel {
    width: min(420px, 92vw);
    text-align: center;
    border: 2px solid #fff;
    border-radius: 16px;
    padding: 24px 18px;
    background: #050505;
  }
  #panel h1 { margin: 0 0 10px; font-size: 30px; }
  #panel p { margin: 8px 0 18px; line-height: 1.6; color: #ddd; }
  #startBtn {
    width: 100%;
    min-height: 58px;
    font-size: 22px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div>STAGE <span id="stage">1</span></div><div>LIFE <span id="life">3</span></div>
  </div>

  <canvas id="game"></canvas>

  <div id="controls">
    <button id="leftBtn" aria-label="左へ">◀</button>
    <button id="rightBtn" aria-label="右へ">▶</button>
  </div>
</div>

<div id="overlay">
  <div id="panel">
    <h1>INVADER MINI</h1>
    <p>左右ボタンで移動します。<br>弾は自動で発射されます。<br>敵を全滅させると巨大ボスが出現！</p>
    <button id="startBtn">ゲーム開始</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const lifeEl = document.getElementById('life');
  const stageEl = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const startBtn = document.getElementById('startBtn');
  const leftBtn = document.getElementById('leftBtn');
  const rightBtn = document.getElementById('rightBtn');

  let W = 0, H = 0, dpr = 1;
  let running = false;
  let last = 0;
  let score = 0;
  let life = 3;
  let moveLeft = false;
  let moveRight = false;
  let fireTimer = 0;
  let enemyShotTimer = 0;
  let enemyDir = 1;
  let enemySpeed = 28;
  let stage = 1;
  let mode = 'wave';
  let boss = null;
  let bossShotTimer = 0;
  let bossFlash = 0;

  let audioCtx = null;
  let masterGain = null;
  let musicTimer = null;
  let musicStep = 0;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.18;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function tone(freq, duration = 0.08, type = 'square', volume = 0.08, slideTo = null) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), now + duration);
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(now);
    osc.stop(now + duration);
  }

  function sfxShot() {
    tone(720, 0.045, 'square', 0.045, 520);
  }

  function sfxHit() {
    tone(180, 0.09, 'square', 0.09, 80);
    setTimeout(() => tone(95, 0.08, 'square', 0.05), 45);
  }

  function sfxDamage() {
    tone(130, 0.18, 'sawtooth', 0.10, 55);
  }

  function sfxWave() {
    [330, 440, 550, 660].forEach((f, i) => {
      setTimeout(() => tone(f, 0.08, 'square', 0.055), i * 80);
    });
  }

  function startMusic() {
    stopMusic();
    const pattern = [110, 110, 147, 110, 165, 147, 110, 98];
    musicStep = 0;
    musicTimer = setInterval(() => {
      if (!running || !audioCtx) return;
      const f = pattern[musicStep % pattern.length];
      tone(f, 0.10, 'square', 0.025);
      if (musicStep % 4 === 2) tone(f * 2, 0.05, 'square', 0.015);
      musicStep++;
    }, 180);
  }

  function stopMusic() {
    if (musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
  }

  const player = { x: 0, y: 0, w: 34, h: 18, speed: 220, inv: 0 };
  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let stars = [];

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    player.y = H - 38;
    player.x = Math.min(Math.max(player.x || W / 2, player.w / 2), W - player.w / 2);

    if (!stars.length) {
      stars = Array.from({length: 70}, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() < .85 ? 1 : 2
      }));
    }
  }

  function resetGame() {
    score = 0;
    life = 3;
    stage = 1;
    mode = 'wave';
    boss = null;
    scoreEl.textContent = score;
    lifeEl.textContent = life;
    stageEl.textContent = stage;
    bullets = [];
    enemyBullets = [];
    player.x = W / 2;
    player.inv = 0;
    enemyDir = 1;
    enemySpeed = 28;
    createWave();
  }

  function createWave() {
    enemies = [];
    const cols = W < 390 ? 7 : 8;
    const rows = 4;
    const ew = 24, eh = 16;
    const gapX = 15, gapY = 18;
    const total = cols * ew + (cols - 1) * gapX;
    const startX = (W - total) / 2;
    const startY = 58;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        enemies.push({
          x: startX + c * (ew + gapX),
          y: startY + r * (eh + gapY),
          w: ew, h: eh,
          alive: true,
          row: r
        });
      }
    }
  }


  function spawnBoss() {
    mode = 'boss';
    bullets = [];
    enemyBullets = [];
    bossShotTimer = 0.5;

    // 約30秒を目安。自動射撃の命中率も考慮してやや硬め。
    const hp = 72 + (stage - 1) * 10;
    boss = {
      x: W / 2,
      y: 112,
      w: Math.min(190, W * 0.52),
      h: 190,
      vx: 70 + (stage - 1) * 7,
      hp,
      maxHp: hp
    };
    sfxWave();
  }

  function defeatBoss() {
    score += 500 * stage;
    scoreEl.textContent = score;
    sfxWave();

    stage++;
    stageEl.textContent = stage;
    enemySpeed = Math.min(100, 28 + (stage - 1) * 8);

    mode = 'wave';
    boss = null;
    bullets = [];
    enemyBullets = [];
    createWave();
  }

  function drawBoss() {
    if (!boss) return;

    ctx.save();
    const x = boss.x;
    const y = boss.y;

    if (bossFlash > 0 && Math.floor(bossFlash * 30) % 2 === 0) {
      ctx.globalAlpha = 0.45;
    }

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // 頭（写真の紙工作風）
    ctx.beginPath();
    ctx.ellipse(x, y - 34, boss.w * 0.34, 44, 0, 0, Math.PI * 2);
    ctx.fill();

    // 目・口の黒い穴
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(x - 31, y - 47, 13, 17, -0.2, 0, Math.PI * 2);
    ctx.ellipse(x + 31, y - 47, 13, 17, 0.2, 0, Math.PI * 2);
    ctx.ellipse(x, y - 18, 20, 24, 0, 0, Math.PI * 2);
    ctx.fill();

    // 首
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 10, y + 7, 20, 24);

    // 胴体
    ctx.fillRect(x - boss.w * 0.25, y + 25, boss.w * 0.5, 80);

    // 腕（ギザギザの手）
    ctx.beginPath();
    ctx.moveTo(x - boss.w * 0.25, y + 48);
    ctx.lineTo(x - boss.w * 0.52, y + 33);
    ctx.lineTo(x - boss.w * 0.68, y + 21);
    ctx.lineTo(x - boss.w * 0.60, y + 39);
    ctx.lineTo(x - boss.w * 0.72, y + 50);
    ctx.lineTo(x - boss.w * 0.55, y + 58);
    ctx.lineTo(x - boss.w * 0.25, y + 66);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x + boss.w * 0.25, y + 48);
    ctx.lineTo(x + boss.w * 0.52, y + 33);
    ctx.lineTo(x + boss.w * 0.68, y + 21);
    ctx.lineTo(x + boss.w * 0.60, y + 39);
    ctx.lineTo(x + boss.w * 0.72, y + 50);
    ctx.lineTo(x + boss.w * 0.55, y + 58);
    ctx.lineTo(x + boss.w * 0.25, y + 66);
    ctx.closePath();
    ctx.fill();

    // 足
    ctx.fillRect(x - 42, y + 101, 22, 65);
    ctx.fillRect(x + 20, y + 101, 22, 65);

    // HPバー
    const barW = Math.min(W - 50, 300);
    const ratio = Math.max(0, boss.hp / boss.maxHp);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect((W - barW) / 2, 20, barW, 12);
    ctx.fillStyle = '#fff';
    ctx.fillRect((W - barW) / 2 + 2, 22, (barW - 4) * ratio, 8);

    ctx.font = 'bold 13px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('BOSS', W / 2, 16);

    ctx.restore();
  }

  function rectHit(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
  }

  function update(dt) {
    if (!running) return;

    const dir = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);
    player.x += dir * player.speed * dt;
    player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
    if (player.inv > 0) player.inv -= dt;

    fireTimer -= dt;
    if (fireTimer <= 0) {
      bullets.push({ x: player.x - 2, y: player.y - 10, w: 4, h: 12, vy: -390 });
      sfxShot();
      fireTimer = 0.32;
    }

    bullets.forEach(b => b.y += b.vy * dt);
    bullets = bullets.filter(b => b.y + b.h > 0);

    enemyBullets.forEach(b => {
      b.y += b.vy * dt;
      if (b.vx) b.x += b.vx * dt;
    });
    enemyBullets = enemyBullets.filter(b => b.y < H + 20);

    let bottomY = 0;

    if (mode === 'wave') {
      let minX = Infinity, maxX = -Infinity;
      for (const e of enemies) if (e.alive) {
        minX = Math.min(minX, e.x);
        maxX = Math.max(maxX, e.x + e.w);
        bottomY = Math.max(bottomY, e.y + e.h);
      }

      let stepDown = false;
      if (minX !== Infinity) {
        if ((enemyDir > 0 && maxX >= W - 12) || (enemyDir < 0 && minX <= 12)) {
          enemyDir *= -1;
          stepDown = true;
        }
        for (const e of enemies) if (e.alive) {
          e.x += enemyDir * enemySpeed * dt;
          if (stepDown) e.y += 12;
        }
      }

      enemyShotTimer -= dt;
      if (enemyShotTimer <= 0) {
        const alive = enemies.filter(e => e.alive);
        if (alive.length) {
          const shooter = alive[Math.floor(Math.random() * alive.length)];
          enemyBullets.push({
            x: shooter.x + shooter.w/2 - 2,
            y: shooter.y + shooter.h + 3,
            w: 4, h: 10, vy: 180 + stage * 10
          });
        }
        enemyShotTimer = Math.max(.38, 1.15 - stage * .07);
      }

      for (const b of bullets) {
        for (const e of enemies) {
          if (!e.alive) continue;
          if (rectHit(b, e)) {
            e.alive = false;
            b.y = -999;
            score += 10;
            sfxHit();
            scoreEl.textContent = score;
            break;
          }
        }
      }
    } else if (mode === 'boss' && boss) {
      boss.x += boss.vx * dt;
      const half = boss.w * 0.36;
      if (boss.x + half > W - 12) {
        boss.x = W - 12 - half;
        boss.vx = -Math.abs(boss.vx);
      } else if (boss.x - half < 12) {
        boss.x = 12 + half;
        boss.vx = Math.abs(boss.vx);
      }

      bossShotTimer -= dt;
      if (bossShotTimer <= 0) {
        const spread = stage >= 3 ? [-55, 0, 55] : [-28, 28];
        for (const vx of spread) {
          enemyBullets.push({
            x: boss.x - 3,
            y: boss.y + 120,
            w: 6, h: 13,
            vy: 205 + stage * 10,
            vx
          });
        }
        bossShotTimer = Math.max(.42, .82 - stage * .04);
      }

      for (const b of bullets) {
        const hitBox = {
          x: boss.x - boss.w * 0.35,
          y: boss.y - 78,
          w: boss.w * 0.70,
          h: 245
        };
        if (rectHit(b, hitBox)) {
          b.y = -999;
          boss.hp--;
          bossFlash = 0.10;
          if (boss.hp % 4 === 0) sfxHit();
          if (boss.hp <= 0) {
            defeatBoss();
            break;
          }
        }
      }
    }

    if (bossFlash > 0) bossFlash -= dt;
    bullets = bullets.filter(b => b.y > -100);

    const pRect = { x: player.x - player.w/2, y: player.y - player.h/2, w: player.w, h: player.h };
    if (player.inv <= 0) {
      for (const b of enemyBullets) {
        if (rectHit(b, pRect)) {
          b.y = H + 999;
          life--;
          sfxDamage();
          lifeEl.textContent = life;
          player.inv = 1.2;
          if (life <= 0) endGame();
          break;
        }
      }
    }

    if (mode === 'wave' && bottomY >= player.y - 18) endGame();

    if (mode === 'wave' && enemies.length && enemies.every(e => !e.alive)) {
      score += 100;
      scoreEl.textContent = score;
      spawnBoss();
    }
  }

  function drawPlayer() {
    const x = Math.round(player.x - player.w/2);
    const y = Math.round(player.y - player.h/2);
    if (player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) return;

    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 14, y, 6, 5);
    ctx.fillRect(x + 8, y + 5, 18, 5);
    ctx.fillRect(x, y + 10, 34, 8);
  }

  function drawEnemy(e) {
    const x = Math.round(e.x), y = Math.round(e.y);
    ctx.fillStyle = '#fff';
    const s = 3;
    ctx.fillRect(x + 3*s, y, 2*s, s);
    ctx.fillRect(x + 1*s, y + 1*s, 6*s, s);
    ctx.fillRect(x, y + 2*s, 8*s, 2*s);
    ctx.fillRect(x + 1*s, y + 4*s, 2*s, s);
    ctx.fillRect(x + 5*s, y + 4*s, 2*s, s);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#444';
    for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s);

    for (const e of enemies) if (e.alive) drawEnemy(e);
    if (mode === 'boss') drawBoss();

    ctx.fillStyle = '#fff';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    ctx.fillStyle = '#aaa';
    enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    drawPlayer();

    ctx.strokeStyle = '#444';
    ctx.beginPath();
    ctx.moveTo(0, H - 18);
    ctx.lineTo(W, H - 18);
    ctx.stroke();
  }

  function loop(t) {
    const dt = Math.min((t - last) / 1000 || 0, .034);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    initAudio();
    resize();
    resetGame();
    overlay.style.display = 'none';
    running = true;
    startMusic();
    last = performance.now();
  }

  function endGame() {
    running = false;
    stopMusic();
    panel.innerHTML = `
      <h1>GAME OVER</h1>
      <p>SCORE ${score}</p>
      <button id="restartBtn">もう一度</button>
    `;
    overlay.style.display = 'flex';
    document.getElementById('restartBtn').addEventListener('click', startGame, {once:true});
  }

  function bindHold(btn, side) {
    const set = v => {
      if (side === 'left') moveLeft = v;
      else moveRight = v;
      btn.classList.toggle('on', v);
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      btn.setPointerCapture?.(e.pointerId);
      set(true);
    });
    ['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(ev => {
      btn.addEventListener(ev, () => set(false));
    });
  }

  bindHold(leftBtn, 'left');
  bindHold(rightBtn, 'right');

  ['contextmenu', 'selectstart', 'dragstart'].forEach(ev => {
    document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  });

  document.addEventListener('touchstart', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      moveLeft = false;
      moveRight = false;
    }
  });

  startBtn.addEventListener('click', startGame);
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
