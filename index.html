<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>EVE VADER イブベーダー ver.1.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;touch-action:none}
#wrap{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
#hud{height:38px;display:flex;align-items:center;justify-content:space-between;font-weight:800;letter-spacing:1px;font-size:14px}
#gamebox{position:relative;flex:1;min-height:0;border:2px solid #fff;border-radius:10px;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;background:#000}
#controls{height:92px;display:flex;gap:12px;align-items:center;justify-content:center}
.ctrl{width:42%;height:64px;border:2px solid #fff;border-radius:14px;background:#000;color:#fff;font-size:30px;font-weight:900;touch-action:none}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;text-align:center;padding:22px;z-index:4}
.panel{width:100%;max-width:420px}
h1{font-size:36px;line-height:1.05;margin:0 0 8px;letter-spacing:2px}
.jp{font-size:20px;margin-bottom:28px}
.small{font-size:13px;line-height:1.7;opacity:.9}
#start{margin-top:22px;border:2px solid #fff;background:#000;color:#fff;border-radius:10px;padding:13px 34px;font-size:20px;font-weight:900}
#message{position:absolute;left:0;right:0;top:43%;text-align:center;font-size:26px;font-weight:900;letter-spacing:2px;pointer-events:none;z-index:3;text-shadow:0 2px #000;display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>STAGE <b id="stage">1</b></span><span>POWER <b id="power">1</b>/4</span><span>LIFE <b id="life">3</b></span></div>
  <div id="gamebox">
    <canvas id="game"></canvas>
    <div id="message"></div>
    <div id="overlay"><div class="panel">
      <h1>EVE VADER</h1><div class="jp">イブベーダー<br><span style="font-size:13px">ver.1.2</span></div>
      <div class="small">左右ボタンで移動<br>弾は自動発射<br>敵を全滅させるとボス出現<br>白黒カプセルで最大4発までパワーアップ</div>
      <button id="start">START</button>
    </div></div>
  </div>
  <div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
</div>
<script>
(()=>{"use strict";
const cvs=document.getElementById("game"),ctx=cvs.getContext("2d");
const overlay=document.getElementById("overlay"),startBtn=document.getElementById("start");
const leftBtn=document.getElementById("left"),rightBtn=document.getElementById("right");
const lifeEl=document.getElementById("life"),stageEl=document.getElementById("stage"),powerEl=document.getElementById("power"),msg=document.getElementById("message");
let W=0,H=0,running=false,last=0,stage=1,life=3,power=1,mode="wave";
let player={x:0,y:0,w:28,h:22},enemies=[],bullets=[],enemyBullets=[],items=[],boss=null;
let dir=1,enemySpeed=28,fireT=0,enemyFireT=0,bossFireT=0,inv=0,moveL=false,moveR=false,endingT=0,transitionT=0;
let audio=null,music=null,mstep=0;

function resize(){const r=cvs.getBoundingClientRect(),d=devicePixelRatio||1;cvs.width=Math.floor(r.width*d);cvs.height=Math.floor(r.height*d);ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;player.y=H-38;player.x=Math.max(20,Math.min(W-20,player.x||W/2))}
function initAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)()} if(audio.state==="suspended")audio.resume()}
function tone(f,d=.06,v=.035,type="square"){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(n+d)}
function musicStart(){musicStop();mstep=0;music=setInterval(()=>{if(running&&mode!=="ending"){let p=[110,147,123,165,110,147,98,123];tone(p[mstep++%p.length],.07,.012)}},210)}
function musicStop(){if(music){clearInterval(music);music=null}}
function message(t,ms=1100){msg.textContent=t;msg.style.display="block";setTimeout(()=>{if(msg.textContent===t)msg.style.display="none"},ms)}
function createWave(){enemies=[];items=[];enemyBullets=[];bullets=[];dir=1;enemySpeed=28+(stage-1)*8;let cols=stage===1?6:stage===2?8:10,rows=stage===1?3:stage===2?5:7;
let gap=stage===1?10:stage===2?7:4;
let ew=Math.min(30,(W-24-(cols-1)*gap)/cols),eh=stage===3?16:20;
let total=cols*ew+(cols-1)*gap,sx=(W-total)/2;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)enemies.push({x:sx+c*(ew+gap),y:45+r*(stage===1?38:stage===2?29:22),w:ew,h:eh,alive:true,drop:false});enemies[Math.floor(Math.random()*enemies.length)].drop=true;mode="wave";enemyFireT=.8;message("STAGE "+stage)}
function reset(){stage=1;life=3;power=1;stageEl.textContent=stage;lifeEl.textContent=life;powerEl.textContent=power;player.x=W/2;player.y=H-38;createWave()}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function playerBox(){return{x:player.x-player.w/2,y:player.y-player.h/2,w:player.w,h:player.h}}
function spawnPlayerShots(){let xs=power===1?[0]:power===2?[-7,7]:power===3?[-12,0,12]:[-17,-6,6,17];xs.forEach(dx=>bullets.push({x:player.x+dx-2,y:player.y-18,w:4,h:12,vy:-420}));tone(720,.035,.018)}
function dropItem(e){items.push({x:e.x+e.w/2-8,y:e.y,w:16,h:28,vy:117})}
function spawnBoss(){mode="boss";bullets=[];enemyBullets=[];items=[];let hp=[72,88,105][stage-1];boss={x:W/2,y:110,w:stage===3?210:180,h:stage===3?250:190,vx:65+stage*12,hp,max:hp,flash:0};bossFireT=.6;message("STAGE "+stage+" BOSS",1300);tone(110,.3,.07,"sawtooth")}
function bossShots(){
 if(!boss)return;
 const y=boss.y+boss.h*.38, base=116+stage*8.4;
 if(stage===1){[-28,28].forEach(vx=>enemyBullets.push({x:boss.x-3,y,w:6,h:12,vx,vy:base}))}
 if(stage===2){[-110,-75,-40,0,40,75,110].forEach(vx=>enemyBullets.push({x:boss.x-3,y,w:6,h:12,vx,vy:base+Math.abs(vx)*.15}))}
 if(stage===3){for(let i=-4;i<=4;i++)enemyBullets.push({x:boss.x-3,y,w:6,h:12,vx:i*38,vy:base+Math.abs(i)*8}); let a=Math.atan2(player.y-y,player.x-boss.x);[-.22,0,.22].forEach(s=>enemyBullets.push({x:boss.x-3,y,w:6,h:12,vx:Math.cos(a+s)*133,vy:Math.sin(a+s)*133}))}
 tone(150-stage*15,.045,.025)
}
function bossBox(){return{x:boss.x-boss.w*.38,y:boss.y-boss.h*.42,w:boss.w*.76,h:boss.h*.88}}
function defeatBoss(){tone(90,.5,.09,"sawtooth");enemyBullets=[];bullets=[];if(stage===3){mode="ending";endingT=0;musicStop();message("BOSS DESTROYED",1700)}else{mode="transition";transitionT=1.7;message("STAGE "+stage+" CLEAR!",1300)}}
function damage(){if(inv>0)return;life--;lifeEl.textContent=life;inv=1.4;tone(75,.28,.08,"sawtooth");if(life<=0){running=false;musicStop();overlay.innerHTML='<div class="panel"><h1>GAME OVER</h1><div class="small">タイトルへ戻ります</div></div>';overlay.style.display="flex";setTimeout(showTitle,2500)}}
function showTitle(){running=false;musicStop();overlay.innerHTML='<div class="panel"><h1>EVE VADER</h1><div class="jp">イブベーダー<br><span style="font-size:13px">ver.1.2</span></div><div class="small">左右ボタンで移動<br>弾は自動発射<br>白黒カプセルで最大4発までパワーアップ</div><button id="start2">START</button></div>';overlay.style.display="flex";document.getElementById("start2").onclick=startGame}
function update(dt){
 if(!running)return;
 if(inv>0)inv-=dt;
 if(mode==="ending"){endingT+=dt;if(endingT>1.8&&endingT<6){msg.style.display="block";msg.innerHTML="THANK YOU<br>FOR PLAYING!<br><span style='font-size:18px'>EVE VADER</span>"}if(endingT>6){msg.style.display="none";showTitle()}return}
 if(mode==="transition"){transitionT-=dt;if(transitionT<=0){stage++;stageEl.textContent=stage;createWave()}return}
 let sp=210+(stage-1)*8;if(moveL)player.x-=sp*dt;if(moveR)player.x+=sp*dt;player.x=Math.max(18,Math.min(W-18,player.x));
 fireT-=dt;if(fireT<=0){spawnPlayerShots();fireT=.31}
 bullets.forEach(b=>b.y+=b.vy*dt);bullets=bullets.filter(b=>b.y>-30);
 enemyBullets.forEach(b=>{b.x+=(b.vx||0)*dt;b.y+=b.vy*dt});enemyBullets=enemyBullets.filter(b=>b.y<H+30&&b.x>-40&&b.x<W+40);
 items.forEach(i=>i.y+=i.vy*dt);items=items.filter(i=>i.y<H+40);
 if(mode==="wave"){
  let min=9999,max=-9999,bottom=0;enemies.forEach(e=>{if(e.alive){min=Math.min(min,e.x);max=Math.max(max,e.x+e.w);bottom=Math.max(bottom,e.y+e.h)}});
  let down=false;if(min<9999&&((dir>0&&max>W-10)||(dir<0&&min<10))){dir*=-1;down=true}
  enemies.forEach(e=>{if(e.alive){e.x+=dir*enemySpeed*dt;if(down)e.y+=12}});
  enemyFireT-=dt;if(enemyFireT<=0){let a=enemies.filter(e=>e.alive);if(a.length){let e=a[Math.floor(Math.random()*a.length)];enemyBullets.push({x:e.x+e.w/2-2,y:e.y+e.h,w:4,h:10,vx:0,vy:180+stage*15})}enemyFireT=Math.max(.45,1.05-stage*.08)}
  bullets.forEach(b=>enemies.forEach(e=>{if(e.alive&&hit(b,e)){e.alive=false;b.y=-99;tone(190,.06,.025);if(e.drop)dropItem(e)}}));
  if(bottom>player.y-18)damage();
  if(enemies.length&&enemies.every(e=>!e.alive))spawnBoss();
 }else if(mode==="boss"&&boss){
  boss.x+=boss.vx*dt;let half=boss.w*.38;if(boss.x+half>W-8){boss.x=W-8-half;boss.vx=-Math.abs(boss.vx)}if(boss.x-half<8){boss.x=8+half;boss.vx=Math.abs(boss.vx)}
  bossFireT-=dt;if(bossFireT<=0){bossShots();bossFireT=stage===1?.78:stage===2?1.03:.80}
  let bb=bossBox();bullets.forEach(b=>{if(hit(b,bb)){b.y=-99;boss.hp--;boss.flash=.08;if(boss.hp%4===0)tone(180,.04,.018);if(boss.hp<=0)defeatBoss()}});
  if(boss.flash>0)boss.flash-=dt;
 }
 const pb=playerBox();
 enemyBullets.forEach(b=>{if(b.y<900&&hit(b,pb)){b.y=999;damage()}});
 items.forEach(i=>{if(hit(i,pb)){i.y=999;if(power<4){power++;powerEl.textContent=power;tone(330,.08,.05);setTimeout(()=>tone(550,.1,.05),80)}else tone(700,.08,.03)}});
 items=items.filter(i=>i.y<900);
}
function drawEnemy(e){ctx.fillStyle="#fff";ctx.fillRect(e.x+5,e.y,e.w-10,5);ctx.fillRect(e.x,e.y+5,e.w,e.h-8);ctx.fillStyle="#000";ctx.fillRect(e.x+7,e.y+8,4,4);ctx.fillRect(e.x+e.w-11,e.y+8,4,4);ctx.fillStyle="#fff";ctx.fillRect(e.x+3,e.y+e.h-3,6,5);ctx.fillRect(e.x+e.w-9,e.y+e.h-3,6,5)}
function drawCapsule(i){ctx.save();ctx.translate(i.x+8,i.y+14);ctx.rotate(.25);ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-7,-13,14,26,7);ctx.stroke();ctx.fillStyle="#fff";ctx.beginPath();ctx.roundRect(-6,0,12,12,5);ctx.fill();ctx.restore()}
function drawBoss(){
 if(!boss)return;ctx.save();ctx.translate(boss.x,boss.y);if(boss.flash>0)ctx.globalAlpha=.45;ctx.fillStyle="#fff";ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.lineJoin="round";
 if(stage===1){
  ctx.beginPath();ctx.ellipse(0,-40,55,43,0,0,Math.PI*2);ctx.fill();ctx.fillRect(-39,2,78,83);
  ctx.beginPath();ctx.moveTo(-39,20);ctx.lineTo(-82,8);ctx.lineTo(-68,22);ctx.lineTo(-88,32);ctx.lineTo(-65,42);ctx.lineTo(-39,38);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(39,20);ctx.lineTo(82,8);ctx.lineTo(68,22);ctx.lineTo(88,32);ctx.lineTo(65,42);ctx.lineTo(39,38);ctx.closePath();ctx.fill();
  ctx.fillRect(-28,82,18,55);ctx.fillRect(10,82,18,55);
  ctx.fillStyle="#000";[[-22,-48],[22,-48],[0,-22]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill()});
 } else if(stage===2){
  // 写真1: 四角い大きな頭、角・鋭い目・牙口、左右の丸い×印、4本の腕、長い脚と右側の尾
  ctx.fillRect(-58,-86,116,86);
  ctx.beginPath();ctx.moveTo(-48,-86);ctx.lineTo(-28,-118);ctx.lineTo(-15,-86);ctx.moveTo(48,-86);ctx.lineTo(28,-118);ctx.lineTo(15,-86);ctx.stroke();
  ctx.fillStyle="#000";
  ctx.beginPath();ctx.moveTo(-35,-62);ctx.lineTo(-12,-70);ctx.lineTo(-19,-50);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(35,-62);ctx.lineTo(12,-70);ctx.lineTo(19,-50);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-25,-34);ctx.lineTo(0,-8);ctx.lineTo(25,-34);ctx.lineTo(18,-4);ctx.lineTo(0,8);ctx.lineTo(-18,-4);ctx.closePath();ctx.fill();
  ctx.fillStyle="#fff";ctx.strokeStyle="#fff";
  [-82,82].forEach(x=>{ctx.beginPath();ctx.arc(x,-35,18,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x-8,-43);ctx.lineTo(x+8,-27);ctx.moveTo(x+8,-43);ctx.lineTo(x-8,-27);ctx.stroke()});
  ctx.fillRect(-47,4,94,90);
  ctx.beginPath();ctx.moveTo(-47,22);ctx.lineTo(-100,8);ctx.lineTo(-76,30);ctx.lineTo(-104,45);ctx.lineTo(-47,42);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(47,22);ctx.lineTo(100,8);ctx.lineTo(76,30);ctx.lineTo(104,45);ctx.lineTo(47,42);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-47,55);ctx.lineTo(-105,50);ctx.lineTo(-92,70);ctx.lineTo(-47,72);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(47,55);ctx.lineTo(105,50);ctx.lineTo(92,70);ctx.lineTo(47,72);ctx.closePath();ctx.fill();
  ctx.fillRect(-30,92,18,60);ctx.fillRect(14,92,18,60);
  ctx.beginPath();ctx.moveTo(47,80);ctx.lineTo(94,105);ctx.lineTo(115,130);ctx.lineTo(101,139);ctx.lineTo(75,116);ctx.lineTo(42,99);ctx.closePath();ctx.fill();
 } else {
  // 写真2: 縦長の胴体に複数の顔、上へ伸びる2本の首＋顔、左右へ伸びる腕＋大きな顔、下にも大きな顔
  ctx.fillRect(-42,-55,84,178);
  ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(-25,-55);ctx.lineTo(-58,-128);ctx.moveTo(25,-55);ctx.lineTo(62,-128);ctx.moveTo(-42,10);ctx.lineTo(-118,-20);ctx.moveTo(42,-5);ctx.lineTo(118,-65);ctx.stroke();
  function face(x,y,w,h,kind=0){ctx.fillStyle="#fff";ctx.fillRect(x-w/2,y-h/2,w,h);ctx.strokeStyle="#000";ctx.lineWidth=2;ctx.fillStyle="#000";
    if(kind===1){ctx.beginPath();ctx.moveTo(x-w*.25,y-h*.15);ctx.lineTo(x-w*.05,y-h*.28);ctx.lineTo(x-w*.12,y-h*.05);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(x+w*.25,y-h*.15);ctx.lineTo(x+w*.05,y-h*.28);ctx.lineTo(x+w*.12,y-h*.05);ctx.closePath();ctx.fill()}
    else{ctx.beginPath();ctx.arc(x-w*.2,y-h*.15,6,0,Math.PI*2);ctx.arc(x+w*.2,y-h*.15,6,0,Math.PI*2);ctx.fill()}
    ctx.beginPath();ctx.ellipse(x,y+h*.18,w*.20,h*.12,0,0,Math.PI*2);ctx.stroke()}
  face(-70,-157,62,58,0);face(75,-157,62,58,1);face(-137,-28,84,78,1);face(139,-72,82,78,0);face(0,151,92,72,0);
  ctx.fillStyle="#000";ctx.beginPath();ctx.arc(-17,-27,7,0,Math.PI*2);ctx.arc(17,-27,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(0,15,23,16,0,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(-18,66,9,0,Math.PI*2);ctx.arc(18,66,9,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(0,105,22,.2,Math.PI*1.8);ctx.stroke();
 }
 ctx.restore();
 const bw=Math.min(W-50,300),ratio=Math.max(0,boss.hp/boss.max);ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.strokeRect((W-bw)/2,10,bw,10);ctx.fillStyle="#fff";ctx.fillRect((W-bw)/2+2,12,(bw-4)*ratio,6);
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";
 for(let i=0;i<30;i++){let x=(i*83+stage*19)%Math.max(1,W),y=(i*137)%Math.max(1,H-80);ctx.fillRect(x,y,1,1)}
 if(mode==="wave")enemies.forEach(e=>{if(e.alive)drawEnemy(e)});if(mode==="boss")drawBoss();
 items.forEach(drawCapsule);ctx.fillStyle="#fff";bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
 if(inv<=0||Math.floor(inv*12)%2===0){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(0,-15);ctx.lineTo(16,12);ctx.lineTo(6,8);ctx.lineTo(0,13);ctx.lineTo(-6,8);ctx.lineTo(-16,12);ctx.closePath();ctx.fill();ctx.fillStyle="#000";ctx.fillRect(-3,1,6,7);ctx.restore()}
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function startGame(){initAudio();resize();reset();overlay.style.display="none";running=true;musicStart();last=performance.now()}
function bind(btn,key){const on=e=>{e.preventDefault();initAudio();if(key==="L")moveL=true;else moveR=true},off=e=>{e.preventDefault();if(key==="L")moveL=false;else moveR=false};["pointerdown","touchstart"].forEach(n=>btn.addEventListener(n,on,{passive:false}));["pointerup","pointercancel","pointerleave","touchend","touchcancel"].forEach(n=>btn.addEventListener(n,off,{passive:false}))}
bind(leftBtn,"L");bind(rightBtn,"R");startBtn.onclick=startGame;
["contextmenu","selectstart","dragstart"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
window.addEventListener("resize",resize);resize();requestAnimationFrame(loop);
})();
</script>
</body></html>
